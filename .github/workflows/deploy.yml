name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: forge-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, test and build
        run: npm run check

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: development
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - name: Check Forge credentials
        id: creds
        run: |
          if [ -z "$FORGE_EMAIL" ] || [ -z "$FORGE_API_TOKEN" ]; then
            echo "::warning::FORGE_EMAIL / FORGE_API_TOKEN secrets are not set; skipping deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and Forge CLI
        if: steps.creds.outputs.ok == 'true'
        run: |
          npm ci
          npm install -g @forge/cli@15
          forge settings set usage-analytics false
      - name: Build UI
        if: steps.creds.outputs.ok == 'true'
        run: npm run build
      - name: Lint manifest
        if: steps.creds.outputs.ok == 'true'
        run: forge lint
      - name: Deploy to Forge development environment
        if: steps.creds.outputs.ok == 'true'
        run: |
          set +e
          forge deploy -e development --non-interactive 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface Forge's error text as annotations so it is visible without opening the log.
            grep -v '^\s*$' deploy.log | tail -n 15 | while IFS= read -r line; do
              echo "::error title=forge deploy::${line//%/%25}"
            done
          fi
          exit "$status"
      - name: Install or upgrade on the Jira site
        if: steps.creds.outputs.ok == 'true'
        env:
          SITE: ${{ vars.FORGE_SITE || 'dashtech.atlassian.net' }}
        run: |
          set +e
          # Upgrade succeeds when already installed (and applies scope changes); otherwise install fresh.
          forge install --upgrade --site "$SITE" --product jira -e development --non-interactive --confirm-scopes 2>&1 | tee install.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            forge install --site "$SITE" --product jira -e development --non-interactive --confirm-scopes 2>&1 | tee install.log
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -ne 0 ]; then
            grep -v '^\s*$' install.log | tail -n 15 | while IFS= read -r line; do
              echo "::error title=forge install::${line//%/%25}"
            done
          fi
          exit "$status"
