name: Publish docs to GitHub Pages

# GitHub Pages serves the gh-pages branch; this keeps it equal to docs/ on main
# (privacy policy at https://ravee-acharya.github.io/capacity-planner/privacy-policy.html).
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Push docs/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # gh-pages is generated from docs/, so it is always replaced wholesale.
          git push --force origin "$(git subtree split --prefix docs HEAD):refs/heads/gh-pages"
