modules:
  jira:globalPage:
    - key: capacity-planner-page
      resource: main
      resolver:
        function: resolver
      title: Capacity Planner
      icon: resource:main;icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: static/app/dist
permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - storage:app
    - read:board-scope:jira-software
    - read:board-scope.admin:jira-software
    - read:sprint:jira-software
    - read:issue-details:jira
    - read:jql:jira
    - read:project:jira
  content:
    styles:
      - unsafe-inline
  external:
    images:
      - address: "*.atl-paas.net"
      - address: "*.atlassian.net"
      - address: secure.gravatar.com
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/b6f79533-faca-4841-bfb4-76a20c3228c4
